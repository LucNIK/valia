# Downloads DVF, rebuilds the clean dataset, measures the references and trains the model.
# Runs on demand and after each DVF publication (April and October).
name: Data

on:
  workflow_dispatch:
    inputs:
      departements:
        description: "'all' or a list such as 75,69,13"
        default: "all"
      years:
        description: "Years to download, e.g. 2021-2025"
        default: "2021-2025"
  schedule:
    - cron: "17 6 20 4,10 *"   # the 20th of April and October, after the semi-annual DVF release

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DEPS: ${{ github.event.inputs.departements || 'all' }}
      YEARS: ${{ github.event.inputs.years || '2021-2025' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch, build, evaluate and train
        run: python -m valia all --years "$YEARS" --departements "$DEPS"
      - uses: actions/upload-artifact@v4
        with:
          name: valia-reports
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: valia-clean-sales
          path: data/clean/
          retention-days: 30
