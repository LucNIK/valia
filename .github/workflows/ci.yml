name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Test (LightGBM)
        run: pytest -q
      - name: Test (scikit-learn fallback)
        run: pytest -q tests/test_model.py
        env:
          VALIA_BACKEND: sklearn

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -e ..
          npm install --no-audit --no-fund
      - name: Type-check (tsc strict, JSDoc)
        run: npx tsc -p .
      - name: Reference estimates from Python (synthetic market)
        working-directory: .
        run: python -m tests.make_web_fixtures web/test/fixtures
      - name: Browser code reproduces Python
        run: npm test
