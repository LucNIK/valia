name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Test (LightGBM)
        run: pytest -q
      - name: Test (scikit-learn fallback)
        run: pytest -q tests/test_model.py
        env:
          VALIA_BACKEND: sklearn
