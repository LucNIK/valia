[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valia"
version = "0.1.0"
description = "French property price estimation from public DVF data, with honest chronological evaluation"
readme = "README.md"
license = "MIT"
authors = [{ name = "John Luke NIKABOU (LucNIK)", email = "lukepulanka@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["valia*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
